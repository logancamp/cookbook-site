<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookbook</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>
<body>
<!-- Trash Button -->
<button id="open-trash-btn">
  <p id="open-trash-txt">
    <span class="material-symbols-outlined">delete</span>
  </p>
</button>

<!-- Recently Deleted Menu -->
<div id="recently-deleted">
  <div class="deleted-header">
    <h2>Recently Deleted</h2>

    <button id="clear-trash" class="deleted-header" data-text="Delete All">
      <span>Delete All</span>
    </button>
    <span class="material-symbols-outlined hidden" id="check-icon">check</span>

  </div>
  <ul id="deleted-recipes-list"></ul>
</div>

<!-- Restore/Delete Confirmation Modal -->
<div id="confirm-modal" class="hidden">
  <div class="modal-content">
    <button id="close-confirm-modal" class="close-btn">&times;</button>
    <p id="confirm-text">Are you sure you want to delete this?</p>
    <div class="button-group">
      <button id="restore-btn">Restore</button>
      <button id="delete-btn">Delete</button>
    </div>
  </div>
</div>



<h1 id="page-title">My Cookbook</h1>

<label>
  <span class="material-symbols-outlined search-icon">search</span>
</label>
<label for="search"></label>
<input type="text" id="search" placeholder="Search recipes..." />

<label for="category-filter"></label>
<select id="category-filter">
  <option value="all">All Categories</option>
</select>

<button id="add-recipe-btn">
  <span class="material-symbols-outlined">add</span> Add Recipe
</button>

<div id="recipe-list"></div>

<!-- View Recipe Modal -->
<div id="view-recipe-modal" class="modal hidden">
  <div class="modal-wrapper">
    <div class="view-recipe-card">
      <button id="close-view-recipe">
        <span class="material-symbols-outlined">close</span>
      </button>
      <h2 id="view-title"></h2>
      <p id="view-category-container"><b>Category:</b> <span id="view-category"></span></p>

      <h3>Ingredients</h3>
      <ul id="view-ingredients-list"></ul>

      <br><h3>Instructions</h3>
      <ul id="view-instructions-list"></ul>
    </div>
    <div id="view-subrecipes"></div>
  </div>
</div>

<!-- Unified Recipe Modal (Replaces New & Edit Modals) -->
<div id="recipe-modal" class="modal hidden">
  <div class="edit-recipe-card">
    <button id="close-recipe-modal" class="close-btn">&times;</button>
    <h2 id="recipe-modal-title">Add Recipe</h2>

    <label for="recipe-title"></label>
    <input type="text" id="recipe-title" placeholder="Recipe Name">

    <label for="recipe-category"></label>
    <input type="text" id="recipe-category" placeholder="Category">

    <!-- Ingredients Section -->
    <div>
      <h3>Ingredients</h3>
      <ul id="recipe-ingredients-list"></ul>

      <label for="recipe-ingredient-input"></label>
      <input type="text" id="recipe-ingredient-input" placeholder="Add ingredient">
      <button id="add-recipe-ingredient">
        <span class="material-symbols-outlined">add</span>
      </button>
    </div>

    <!-- Instructions Section -->
    <div>
      <h3>Instructions</h3>
      <ul id="recipe-instructions-list"></ul>

      <label for="recipe-instruction-input"></label>
      <input type="text" id="recipe-instruction-input" placeholder="Add instruction">
      <button id="add-recipe-instruction">
        <span class="material-symbols-outlined">add</span>
      </button>
      <button id="add-sub-recipe-btn">
        <span class="material-symbols-outlined">call_split</span> Add Sub-Recipe
      </button>
      <div id="subrecipe-preview" class="subrecipe-container"></div>
    </div>

    <button id="save-recipe">Save</button>
    <button id="cancel-recipe">Cancel</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
